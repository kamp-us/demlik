name: publish

# Per-merge publishing for every public package under packages/, version-PR model. Trusted
# publishing can only ship a NEW version number, so this job is version-gated: a merge to main
# publishes a package ONLY when its package.json version is not yet on npm. Versioning is a PR — someone runs
# `pnpm changeset version` on a branch, the queue merges it, this job sees the new
# number and ships it. The job never pushes to main: branch rules reject a direct push
# (the 2026-09-06 0.13.0 run published and then lost its version commit to exactly that
# rejection, leaving every later merge refused as "cannot publish over 0.13.0").
#
# WHY scripted, not `changesets/action`: the standard changesets action opens a
# "Version Packages" PR, and bot-PR creation is org-gated here ("Actions not permitted
# to create PRs"). We sidestep that wall entirely by versioning + publishing inline and
# pushing the bump commit straight to main (a push, not a PR).
on:
  push:
    branches:
      - main
  # Manual trigger so a re-run doesn't need an empty [skip ci]-dodging commit.
  workflow_dispatch:

# Least privilege: contents:read (the job pushes nothing); id-token:write for npm
# trusted publishing (OIDC — tokenless, no NODE_AUTH_TOKEN).
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # npm trusted publishing (OIDC, tokenless) needs npm CLI >= 11.5. Node 22 ships
      # npm 10.x, so upgrade and hard-assert the floor before anything relies on it.
      - name: Upgrade npm to >= 11.5 (trusted-publishing floor)
        run: |
          npm install -g npm@latest
          NPM_VER="$(npm --version)"
          echo "npm ${NPM_VER}"
          MIN=11.5.0
          if [ "$(printf '%s\n%s\n' "$MIN" "$NPM_VER" | sort -V | head -n1)" != "$MIN" ]; then
            echo "::error::npm >= ${MIN} required for OIDC trusted publishing, got ${NPM_VER}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # One row per public workspace package whose package.json version is not on npm yet.
      # Each package is gated on its own version, so a tea release never re-publishes
      # code-graph and a code-graph release never blocks on tea.
      - name: Detect which package versions are not on npm yet
        id: version
        run: |
          pending=""
          for dir in packages/*/; do
            name="$(node -p "require('./${dir}package.json').name")"
            v="$(node -p "require('./${dir}package.json').version")"
            if [ "$(node -p "!!require('./${dir}package.json').private")" = "true" ]; then continue; fi
            if npm view "${name}@${v}" version >/dev/null 2>&1; then
              echo "${name}@${v} is already published — nothing to do."
            else
              echo "${name}@${v} is not on npm — publishing."
              pending="${pending} ${dir%/}"
            fi
          done
          echo "pending=${pending# }" >> "$GITHUB_OUTPUT"

      # Every pending package gets its own attempt, built from the commit that set its version
      # (not main's HEAD), then one summary line per package; the step goes red only after all
      # of them were tried. The inline loop this replaces stopped at the first failed publish,
      # so code-graph's 404 kept tea 0.18.0 from ever being attempted (#372).
      #
      # The script also runs the last gate before each tarball is cut: a package's own
      # `scripts/verify-exports.mjs` (tea's), against the dist it is about to pack.
      # `prepublishOnly` carries that same walker, but nothing on this path triggers it —
      # `pnpm pack` runs prepack/prepare, and `npm publish <tarball>` skips the publish
      # lifecycle entirely. Without it the guard written for the v0.1.1 stale-dist incident
      # does not run on the job that publishes.
      #
      # OIDC trusted publishing via pack + `npm publish <tarball>`. `pnpm publish` shells
      # `npm@latest` and FORWARDS its pnpm-only `--no-git-checks` flag to npm, which rejects
      # the unknown flag and dies at flag-parse BEFORE the OIDC handshake. We sidestep that
      # wall by packing first, then `npm publish` ships the tarball directly — no git-checks
      # concept, no flag to forward. npm >= 11.5 (asserted above) exchanges the id-token
      # automatically on tarball publish — tokenless, no NODE_AUTH_TOKEN. `pnpm pack` also
      # applies each package's `publishConfig` (code-graph's dist-pointed `exports`).
      #
      # REQUIRES an npmjs.com trusted-publisher registration per package, pointing at
      # kamp-us/demlik + this workflow file (owner-only, manual) or npm rejects the token.
      # npm only offers that registration on a package that already exists, so a NEW
      # package's first version is published by hand, then registered.
      #
      # No `--provenance` yet: it was disabled because the old home was a PRIVATE repo. This
      # repo is public, so provenance can be re-enabled as a deliberate follow-up.
      - name: Publish to npm (each package from its version commit, every package attempted)
        if: steps.version.outputs.pending != ''
        env:
          PENDING: ${{ steps.version.outputs.pending }}
        run: |
          read -ra dirs <<< "$PENDING"
          node scripts/publish-pending.mjs --work-dir "$RUNNER_TEMP/publish" "${dirs[@]}"
