name: build

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Fast + deterministic, so it gates before the slower test/build.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint (Biome)
        run: pnpm run lint

      # The generated reference quadrant is the single drift gate: this regenerates
      # docs/reference/ from the typedoc model and fails WITH THE PATCH (git diff) if
      # the committed pages are stale — the fix is copy-paste: `pnpm run docs:reference`
      # locally, then commit. Runs before the tests so the patch surfaces first; the
      # generator reads SOURCE via typedoc (not dist), so it needs no prior build.
      - name: Docs reference drift
        run: |
          pnpm run docs:reference:check || {
            echo "::error::Reference docs are stale — run 'pnpm run docs:reference' and commit docs/reference/. Drift patch is printed above.";
            exit 1;
          }

      # Cheap, deterministic, and catches a public-API mistake the tests cannot:
      # a subpath added to the export map with no tier stamp ships with no stated
      # stability promise. Runs before the slower suites.
      - name: Check every export carries a tier stamp
        run: node scripts/check-export-stamps.mjs

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      # The dist walker that makes the v0.1.1 failure class (an export map entry
      # with no matching dist/ output — a broken published subpath) unshippable.
      # It is ALSO wired to `prepublishOnly`, but that hook never fires on the
      # release path: publish.yaml packs a tarball and runs `npm publish <tgz>`,
      # and neither `pnpm pack` nor a tarball publish runs `prepublishOnly`. So
      # this step is the one place the guard actually executes on every change.
      - name: Verify every export resolves in dist
        run: node scripts/verify-exports.mjs
