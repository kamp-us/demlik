name: build

on:
  # A pull request runs once, on its own event, and so does a push to main, for what lands there
  # without one. `push` on every branch ran each pull request twice, the same build side by side.
  push:
    branches:
      - main
  # No `branches` filter, so a pull request runs whatever its base is. A stacked PR whose BASE
  # contains a slash (`can/some-branch`) once matched neither trigger and got no CI at all,
  # silently, because a PR with zero checks reads the same as a PR whose checks have not started
  # yet: a `*` filter matches a single path SEGMENT, and `**` was the fix. No filter has no such
  # slip.
  pull_request:
  # GitHub's merge queue tests each group on a temporary branch (`gh-readonly-queue/...`) and
  # takes the required check only from this event: "You must use the merge_group event to trigger
  # your GitHub Actions workflow when a pull request is added to a merge queue", else "the merge
  # will fail as the required status check will not be reported"
  # (docs.github.com, "Managing a merge queue"). `push` used to give the queue that run by matching
  # every branch; narrowing `push` to main made this trigger the queue's only one.
  merge_group:
    types: [checks_requested]

# A newer push to the same pull request stops the run it replaces. The queue's runs and main's
# each have their own commit and all finish. Only a new head cancels: a reopened pull request
# on the same head waits for the run already going.
concurrency:
  group: build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  # Which test jobs this build starts (.github/ci/changes.mjs): the packages its changed files
  # touch and the packages that depend on them. pnpm reads the dependencies from each package.json.
  # Unreadable history, a path no rule knows, the lockfile, a root config and .github/** run every
  # test. It needs pnpm (`pnpm ls`) but no install, so it answers in seconds beside `checks`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.diff.outputs.test }}
      legs: ${{ steps.diff.outputs.legs }}
    steps:
      # The whole history: a pull request's changed files start at the merge base of its base and
      # head, and a queue group's at the group's base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          EVENT: ${{ github.event_name }}
        run: node .github/ci/changes.mjs

  # Every step that is not a test. Cheap, so it runs on every build, whatever changed.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Depth 2, not the default 1: on a pull request the checkout is the merge of
      # the PR into its base, and the "Published API" step below diffs against
      # that merge's first parent — the base commit — so it has to be fetched.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # First, because it is the cheapest and because every other gate has
      # already been observed to miss it: a merge left conflict markers in two
      # markdown files and typecheck, lint, build, verify-exports AND
      # check-export-stamps all passed on the result.
      - name: Conflict markers
        run: pnpm run check:merge-markers

      # Every `.fabrika.jsonc` governed root must have a control-plane row in
      # CODEOWNERS. The #307 move updated one and not the other, and tea's export
      # map could then merge without control-plane review (#358).
      - name: CODEOWNERS covers every governed root
        run: pnpm run check:codeowners

      # Every dependency specifier is `catalog:` / `catalog:<name>` / `workspace:`,
      # so a pin lives once in pnpm-workspace.yaml. Unrun, this guard sat red
      # locally on every lane and a real red read the same as the standing one.
      - name: Catalog guard
        run: pnpm run check:catalog

      # Fast + deterministic, so it gates before the slower test/build.
      - name: Typecheck
        run: pnpm run typecheck

      # The SHIPPED program excludes `**/*.test.ts`, so the test files are not in
      # it — and for a package whose whole value is a compile-time guarantee, the
      # files that DEMONSTRATE that guarantee (the hand-written-interface
      # regressions, the `.test-d.ts` assertions) have to compile too. `tsconfig.test.json`
      # is the same options over the same tree with that exclusion dropped, minus a
      # named, shrink-only list of pre-existing debt.
      - name: Typecheck tests
        run: pnpm run typecheck:test

      - name: Lint (Biome)
        run: pnpm run lint

      # The generated reference quadrant is the single drift gate: this regenerates
      # docs/reference/ from the typedoc model and fails WITH THE PATCH (git diff) if
      # the committed pages are stale — the fix is copy-paste: `pnpm run docs:reference`
      # locally, then commit. Runs before the tests so the patch surfaces first; the
      # generator reads SOURCE via typedoc (not dist), so it needs no prior build.
      - name: Docs reference drift
        run: |
          pnpm --filter @demlik/tea run docs:reference:check || {
            echo "::error::Reference docs are stale — run 'pnpm --filter @demlik/tea run docs:reference' and commit packages/tea/docs/reference/. Drift patch is printed above.";
            exit 1;
          }

      # Cheap, deterministic, and catches a public-API mistake the tests cannot:
      # a subpath added to the export map with no tier stamp ships with no stated
      # stability promise. Runs before the slower suites.
      - name: Check every export carries a tier stamp
        run: pnpm --filter @demlik/tea exec node scripts/check-export-stamps.mjs

      # The step above checks that every subpath HAS a tier; this one holds a PR
      # to what the tier promises. It diffs every name tea publishes against the
      # PR's base commit and fails, naming the name, its subpath, its tier and
      # the before/after text, when a change lacks the changeset MAINTAINING.md's
      # semver policy asks for. A PR that changes no published name passes with
      # no changeset. `HEAD^1` is the base commit the checkout merged the PR
      # into, so the diff holds exactly what the PR adds. Pull requests only: a
      # push has no base to diff against. The script never passes without one:
      # with `TEA_API_BASE` unset or empty it exits 1 and prints the command
      # that gives a base, and a base that names no commit exits 1 naming it.
      - name: Published API changes carry the changeset their tier asks for
        if: github.event_name == 'pull_request'
        env:
          TEA_API_BASE: HEAD^1
        run: pnpm --filter @demlik/tea run api:ratchet

      - name: Build
        run: pnpm run build

      # The only thing here that reaches the package the way an INSTALLER does —
      # `examples/**` compiled against the published specifiers and `dist`, not
      # against `src`. `typecheck` compiles `src` against itself and so can never
      # catch an export map that resolves internally and not from outside. Runs
      # after Build because `dist` is what it resolves against. Left unwired it
      # drifted sixteen errors red (#24); a gate that is off is not a gate that is
      # lenient, it is a gate that is lying.
      - name: Typecheck consumers
        run: pnpm --filter @demlik/tea run typecheck:consumers

      # The dist walker that makes the v0.1.1 failure class (an export map entry
      # with no matching dist/ output — a broken published subpath) unshippable.
      # It is ALSO wired to `prepublishOnly`, but that hook never fires on the
      # release path: publish.yaml packs a tarball and runs `npm publish <tgz>`,
      # and neither `pnpm pack` nor a tarball publish runs `prepublishOnly`. So
      # this step is the one place the guard actually executes on every change.
      - name: Verify every export resolves in dist
        run: pnpm --filter @demlik/tea exec node scripts/verify-exports.mjs

      - name: Import every code-graph subpath from dist
        run: pnpm --filter @demlik/code-graph run verify:exports

      - name: Import every structure-sweep and backlog-sweep export from dist
        run: |
          pnpm --filter @demlik/structure-sweep run verify:exports
          pnpm --filter @demlik/backlog-sweep run verify:exports

      # The one gate that runs the case this repo's node_modules can never
      # reproduce: pack the tarball, install it into a temp project WITHOUT the
      # optional `ws` peer, and import `@demlik/tea/node`. Every in-repo gate
      # stayed green while 0.12.0 shipped a subpath no clean install could import
      # (#113), because `ws` is always present here.
      - name: Import /node with no optional peer installed
        run: pnpm --filter @demlik/tea exec node scripts/verify-optional-peer-install.mjs

  # One job per leg `changes` chose, each the vitest run of one slice of the suite (a package, or
  # the root's `scripts` project): `vitest run <slice>` under the root config, the same projects
  # `pnpm test` runs. CI tests before it builds, so no leg needs a `dist/`.
  test:
    name: test ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.legs) }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Run tests
        env:
          ARGS: ${{ matrix.args }}
        run: pnpm exec vitest run $ARGS

  # The one check the `main protection` ruleset requires: its context is "test-and-build", the
  # name the single job here had, so the ruleset needed no edit. It never skips (`if: always()`),
  # because GitHub counts a skipped required check as passed, and it passes a job's skip only when
  # `changes` said that job need not run (required.mjs). The same job gives the merge queue its
  # check: a group reports it through `merge_group`.
  # No install and no setup: the runner's own Node runs required.mjs.
  test-and-build:
    needs: [changes, checks, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci

      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/ci/required.mjs
