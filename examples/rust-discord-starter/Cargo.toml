[package]
name = "demlik-discord-starter"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

# This application resolves independently of the monorepo's Cargo workspace.
[workspace]

[features]
default = []
discord = ["dep:serenity"]

[dependencies]
demlik-tea = { path = "../../crates/tea" }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
serenity = { version = "=0.12.5", optional = true, default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }

[dev-dependencies]
serde_json = "=1.0.154"
reqwest = { version = "=0.12.28", default-features = false }
