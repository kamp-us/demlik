[package]
name = "demlik-code-graph"
description = "Source analysis, graph queries and architecture rules."
version.workspace = true
edition.workspace = true
rust-version = "1.96"
repository.workspace = true
license = "Apache-2.0"

[dependencies]
# Biome's published parser family predates incompatible caret patch releases.
biome_json_parser = "=0.5.7"
biome_json_syntax = "=0.5.7"
biome_rowan = "=0.5.7"
biome_parser = "=0.5.7"
biome_console = "=0.5.7"
biome_diagnostics = "=0.5.7"
biome_text_size = "=0.5.7"
biome_text_edit = "=0.5.7"
biome_unicode_table = "=0.5.7"
indexmap.workspace = true
icu_collator = "=2.1.1"
regress = { version = "=0.12.0", features = ["utf16"] }
ryu-js = "=1.0.3"
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse", "preserve_order"] }
toml_parser = { version = "=1.1.5", default-features = false, features = ["std"] }
oxc_resolver = "=11.24.2"
oxc_allocator = "=0.151.0"
oxc_ast = { version = "=0.151.0", features = ["serialize"] }
oxc_ast_visit = { version = "=0.151.0", features = ["serialize"] }
oxc_parser = "=0.151.0"
oxc_span = "=0.151.0"
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth", "raw_value"] }
