[package]
name = "demlik-tea"
description = "Durable, replayable state machines with effects represented as data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "MIT"

[features]
default = []
pbt = ["dep:proptest"]

[dependencies]
proptest = { workspace = true, optional = true }
serde.workspace = true
libm.workspace = true
serde_json.workspace = true
serde-value.workspace = true
indexmap.workspace = true
ryu-js.workspace = true
fastrand.workspace = true
getrandom.workspace = true
futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[[example]]
name = "pbt_property_driver"
required-features = ["pbt"]

[[example]]
name = "pbt_constructors_interface"
required-features = ["pbt"]

[[example]]
name = "pbt_constructors_driver"
required-features = ["pbt"]
