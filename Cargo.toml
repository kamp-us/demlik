[workspace]
members = ["crates/tea", "crates/code-graph", "crates/parity"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
repository = "https://github.com/kamp-us/demlik"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip", "raw_value"] }
serde-value = "0.7"
indexmap = { version = "2", features = ["serde"] }
libm = "0.2"
ryu-js = "1.0"
fastrand = { version = "2.5", features = ["js"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
futures = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "fs", "io-util"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
demlik-tea = { path = "crates/tea" }
demlik-code-graph = { path = "crates/code-graph" }
