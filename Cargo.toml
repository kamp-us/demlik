[workspace]
members = ["crates/tea", "crates/code-graph", "crates/parity"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
repository = "https://github.com/kamp-us/demlik"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
libm = "0.2"
ryu-js = "1.0"
fastrand = { version = "2.5", features = ["js"] }
demlik-tea = { path = "crates/tea" }
demlik-code-graph = { path = "crates/code-graph" }
